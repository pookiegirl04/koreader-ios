name: macos

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
   

defaults:
  run:
    shell: bash

jobs:

  macos:

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: '15'
            platform: 'x86-64'
            xcode_version: '16.4'
            deployment_target: '10.15'
            jobs: 5
          - image: '15'
            platform: 'ARM64'
            xcode_version: '16.4'
            deployment_target: '11.0'
            jobs: 4

    name: "macOS ${{ matrix.image }} ${{ matrix.platform }} 🔨${{ matrix.xcode_version }} 🎯${{ matrix.deployment_target }}"

    runs-on: "macos-${{ matrix.image }}${{ matrix.platform == 'x86-64' && '-intel' || '' }}"

    env:
      # Bump first number to reset all caches.
      CACHE_KEY: "1-macOS-${{ matrix.image }}-${{ matrix.platform }}-XC${{ matrix.xcode_version }}-DT${{ matrix.deployment_target }}"
      CLICOLOR_FORCE: '1'
      KODEBUG: ""
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      MAKEFLAGS: OUTPUT_DIR=build PARALLEL_JOBS=${{ matrix.jobs }} INSTALL_DIR=install TARGET=macos

    steps:

      # Install dependencies. {{{

      - name: XCode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode_version }}.app
          xcodebuild -version
          xcode-select -p

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -x
          python3 -m pip install --disable-pip-version-check meson ruamel.yaml
          wget -O ninjatracing.zip https://github.com/cradleapps/ninjatracing/archive/084212eaf68f25c70579958a2ed67fb4ec2a9ca4.zip
          unzip -j ninjatracing.zip '*/ninjatracing'
          install -m755 ninjatracing /usr/local/bin/
          rm ninjatracing*
          # Install brew packages.
          packages=(
            autoconf
            automake
            bash
            binutils
            coreutils
            findutils
            libtool
            make
            nasm
            ninja
            pkg-config
            util-linux
          )
          # Don't auto-update.
          export HOMEBREW_NO_AUTO_UPDATE=1
          # Don't upgrade already installed formulas.
          export HOMEBREW_NO_INSTALL_UPGRADE=1
          # Remove some installed packages to prevent brew
          # from attempting (and failing) to upgrade them.
          brew uninstall gradle maven
          brew install --formula --overwrite --quiet "${packages[@]}"

      - name: Update PATH
        run: >
          printf '%s\n'
          "$(brew --prefix)/opt/findutils/libexec/gnubin"
          "$(brew --prefix)/opt/make/libexec/gnubin"
          "$(brew --prefix)/opt/util-linux/bin"
          | tee "${GITHUB_PATH}"

      # }}}

      # Checkout / fetch. {{{

   # Checkout / fetch. {{{

    # Checkout / fetch. {{{

      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-tags: true
          fetch-depth: 0
          filter: tree:0
          show-progress: false

      - name: Fetch Git Tags & Create Version File
        run: |
          git remote add upstream https://github.com/koreader/koreader.git || true
          git fetch upstream --tags --force || true
          echo "v2026.01-0-g$(git rev-parse --short HEAD)_$(date +%Y-%m-%d)" > git-rev

      - name: Fetch
        run: make fetchthirdparty

      # }}}
      # Restore / setup build cache. {{{

      - name: Lookup or restore build cache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ${{ env.CACHE_KEY }}-ccache-${{ hashFiles('cache-key') }}
          restore-keys: ${{ env.CACHE_KEY }}-ccache-
          # When not building, do a lookup so the cache
          # does not get removed after 7 days with no use.
          lookup-only: ${{ steps.build-restore.outputs.cache-hit }}

      - name: Install ccache
        if: steps.build-restore.outputs.cache-hit != 'true'
        run: |
          wget --progress=dot:mega https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-darwin.tar.gz
          tar xf ccache-4.10.2-darwin.tar.gz
          printf '%s\n' "$PWD/ccache-4.10.2-darwin" >>"${GITHUB_PATH}"

      - name: Setup build cache
        if: steps.build-restore.outputs.cache-hit != 'true'
        run: |
          set -x
          which ccache
          ccache --version
          ccache --zero-stats
          ccache --max-size=256M
          ccache --show-config

      # }}}

      # Build. {{{

      - name: Build
        id: build
        if: steps.build-restore.outputs.cache-hit != 'true'
        run: make base

      - name: Dump build timings
        if: contains('failure success', steps.build.conclusion) && !cancelled()
        run: make buildstats

      # }}}

      # Clean / save build cache. {{{

      - name: Clean caches
        if: contains('failure success', steps.build.conclusion) && !cancelled()
        run: |
          set -x
          # Trim the build directory.
          rm -rf build/{cmake,staging,thirdparty}
          ccache --cleanup >/dev/null
          ccache --show-stats --verbose

      - name: Save build cache
        uses: actions/cache/save@v5
        if: steps.build-restore.outputs.cache-hit != 'true' && steps.ccache-restore.outputs.cache-hit != 'true'
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      # }}}

      # Dump & check binaries. {{{

      - name: Dump binaries runtime path & dependencies
        run: make bininfo

      - name: Checking binaries for missing dependencies
        run: make bincheck

      # }}}

      - name: Save build directory
        uses: actions/cache/save@v5
        if: steps.build-restore.outputs.cache-hit != 'true'
        with:
          path: build
          key: ${{ steps.build-restore.outputs.cache-primary-key }}

     # - name: Test
      #  run: ./base/utils/fake_tty.py make --assume-old=base testfront

      # Generate / upload artifact. {{{

    # Dump & check binaries. {{{

      - name: Dump binaries runtime path & dependencies
        run: make bininfo

      - name: Checking binaries for missing dependencies
        run: make bincheck

      # }}}

      - name: Save build directory
        uses: actions/cache/save@v5
        if: steps.build-restore.outputs.cache-hit != 'true'
        with:
          path: build
          key: ${{ steps.build-restore.outputs.cache-primary-key }}

      # - name: Test
      #   run: ./base/utils/fake_tty.py make --assume-old=base testfront

      # Generate / upload iOS IPA artifact. {{{

    # Generate / upload iOS IPA artifact. {{{

  # Generate / upload iOS IPA artifact. {{{
# Generate / upload iOS IPA artifact. {{{

      - name: Install iOS Prerequisites
        run: |
          brew install autoconf automake bash binutils cmake coreutils findutils \
            gettext gnu-getopt libtool make meson nasm ninja pkgconf sdl3 \
            util-linux xcodegen

      - name: Build KOReader Base Libraries
        run: |
          export PATH="$(brew --prefix)/opt/findutils/libexec/gnubin:$(brew --prefix)/opt/gnu-getopt/bin:$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/opt/util-linux/bin:${PATH}"
          make TARGET=macos base || true
          make TARGET=ios xcodeproj
          make TARGET=ios base

      - name: Build iOS App and Create IPA
        run: |
          export PATH="$(brew --prefix)/opt/findutils/libexec/gnubin:$(brew --prefix)/opt/gnu-getopt/bin:$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/opt/util-linux/bin:${PATH}"
          xcodebuild build \
            -project KOReader.xcodeproj \
            -scheme KOReader \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/KOReader.app Payload/
          zip -r koreader-ios.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: koreader-ios-ipa
          path: koreader-ios.ipa

      # }}}

      # }}}

      # }}}
    
      # }}}

